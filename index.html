<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>enana - F2 PID cut editor</title>
  <style>
    body { margin: 0; background: #f5f7fa; color: #152238;
           font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 1120px; margin: 28px auto; padding: 0 16px; }
    header { display: flex; align-items: center; justify-content: space-between;
             gap: 20px; flex-wrap: wrap; }
    h1 { font-size: 1.5rem; margin: 0; }
    .panel { margin-top: 18px; background: white; padding: 16px;
             border: 1px solid #dde2e9; border-radius: 12px; }
    #histogram { width: 100%; height: min(70vh, 650px); min-height: 400px; }
    .toolbar { display: flex; align-items: center; gap: 16px;
               flex-wrap: wrap; margin-bottom: 10px; }
    button { padding: 7px 14px; font-size: 1rem; cursor: pointer; }
    #status { color: #42566e; }
    .hint { color: #52677b; font-size: 0.9rem; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>enana : F2 PID Cut Editor</h1>
    <a href="/">通常のTHttpServer画面に戻る</a>
  </header>
  <section class="panel">
    <div class="toolbar">
      <button type="button" id="reload">ヒストグラムを更新</button>
      <span id="status" role="status">読み込み準備中</span>
    </div>
    <div id="histogram"></div>
    <p class="hint">ステップ1：表示機能のみ。次のステップで多角形カットの編集機能を追加します。</p>
  </section>
</main>
<script type="module">
  import { httpRequest, draw, redraw } from "/jsrootsys/modules/main.mjs";

  let initialized = false;
  let loading = false;
  const status = document.getElementById("status");

  async function refreshHistogram() {
    if (loading) return;
    loading = true;
    status.textContent = "読み込み中...";
    try {
      const hist = await httpRequest("/PID/h_pid_f2/root.json", "object");
      if (!initialized) {
        await draw("histogram", hist, "colz");
        initialized = true;
      } else {
        await redraw("histogram", hist, "colz");
      }
      status.textContent = "最終更新: " + new Date().toLocaleTimeString("ja-JP");
    } catch (err) {
      console.error(err);
      status.textContent = "取得失敗: " + String(err);
    } finally {
      loading = false;
    }
  }

  document.getElementById("reload").addEventListener("click", refreshHistogram);
  refreshHistogram();
</script>
</body>
</html>
